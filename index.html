<style>
/* Layout: una columna tipo teléfono (390 x 844) centrada; en móvil ocupa toda la pantalla. */
:root{
  --bg:#0f1f27; --stage:#091419; --ink:#dbe8ec; --ink-soft:#b9cdd4; --ink-mute:#8fa8b0;
  --water:#4c9bb3; --line:#5f93a3; --line-soft:#2b4a58; --panel:#14303b; --accent:#9fd0df;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
:root{--gap:64px}
@media (display-mode: standalone){:root{--gap:0px}}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--sans);display:grid;place-items:start center;overflow:hidden}
.app{width:100%;max-width:430px;height:calc(100% - var(--gap));max-height:900px;position:relative;overflow:hidden;background:var(--bg)}
@media (min-width:560px) and (min-height:720px){
  body{place-items:center}
  .app{height:min(100%,844px);border-radius:30px;border:1px solid #24424f;box-shadow:0 30px 80px rgba(0,0,0,.45)}
}
.s[data-screen="00"]{width:390px;height:844px;box-sizing:border-box;padding:36px 24px 32px;background:#0f1f27;display:flex;flex-direction:column;font-family:"Cormorant Garamond",serif;font-weight:500;color:#dbe8ec}
.s[data-screen="00"] .w{margin:0 0 24px;font-size:14px;letter-spacing:.3em;text-transform:uppercase}
.s[data-screen="00"] .b{margin-top:auto;align-self:center;width:210px;height:48px;border:1px solid #dbe8ec;border-radius:24px;background:transparent;color:#dbe8ec;font-family:inherit;font-weight:500;font-size:18px;cursor:pointer}
.s[data-screen="00"] a.b{display:flex;align-items:center;justify-content:center;box-sizing:border-box;text-decoration:none}
.s[data-screen="00"] .t{margin:0 0 12px;font-weight:500;font-size:28px;line-height:34px}
.s[data-screen="00"] .p{margin:0;font-size:18px;line-height:25px;color:#b9cdd4;text-align:center}
.s[data-screen="00"] .o{min-height:48px;border:1px solid #5f93a3;border-radius:14px;background:transparent;color:#dbe8ec;font-family:inherit;font-weight:500;font-size:18px;cursor:pointer}
.s[data-screen="00"] .o[aria-pressed=true]{background:#1f4452;border-color:#9fd0df}
.s[data-screen="00"] .f{box-sizing:border-box;padding:10px 16px 6px;border:1px solid #5f93a3;border-radius:14px;display:flex;flex-direction:column}
.s[data-screen="00"] .f label{font-size:18px}
.s[data-screen="00"] .f input{border:none;border-bottom:1px solid #5f93a3;background:transparent;color:#dbe8ec;font-family:inherit;font-weight:500;font-size:17px;padding:6px 0}
.s[data-screen="00"] input::placeholder{color:#8fa8b0}
.s[data-screen="00"] .wf{stroke-dasharray:100 100;animation:wf-00 6s ease-in-out infinite}
@keyframes wf-00{0%{stroke-dashoffset:100}55%{stroke-dashoffset:0}80%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
@media (prefers-reduced-motion:reduce){.s[data-screen="00"] .wf{animation:none;stroke-dashoffset:0}}
.s[data-screen="00"] .w{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:5;margin:0 0 6px}
.s[data-screen="00"] .ix{position:relative}
.s[data-screen="00"] .ix>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px;padding-left:12px;font-family:"Open Sans",sans-serif;font-size:12px;font-weight:500;letter-spacing:.03em;text-transform:none;color:#dbe8ec}
.s[data-screen="00"] .ix>summary::-webkit-details-marker{display:none}
.s[data-screen="00"] .ix>summary::after{content:"";width:6px;height:6px;border-right:1.5px solid #dbe8ec;border-bottom:1.5px solid #dbe8ec;transform:rotate(45deg);margin-top:-3px}
.s[data-screen="00"] .mn{position:absolute;right:0;top:100%;width:230px;box-sizing:border-box;padding:6px 14px;background:#14303b;border:1px solid #2b4a58;border-radius:14px;font-family:"Open Sans",sans-serif;font-size:13px;letter-spacing:0;text-transform:none;font-weight:400;z-index:20}
.s[data-screen="00"] .mn details>summary,.s[data-screen="00"] .mn .gr{list-style:none;cursor:pointer;min-height:42px;display:flex;align-items:center;color:#dbe8ec}
.s[data-screen="00"] .mn details>summary::-webkit-details-marker{display:none}
.s[data-screen="00"] .mn ul{margin:0 0 6px;padding:0 0 0 14px;list-style:none}
.s[data-screen="00"] .mn li{min-height:36px;display:flex;align-items:center;color:#b9cdd4}
.s[data-screen="00"] .mn .on,.s[data-screen="00"] .mn details.on>summary{color:#9fd0df;font-weight:600}
.s[data-screen="00"]{gap:14px}
.s[data-screen="00"] .mn a,.s[data-screen="00"] .mn details>summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;color:#dbe8ec;text-decoration:none;font-size:13px}

roke-dashoffset\" values=\"100;0;0;-100\" keyTimes=\"0;0.55;0.8;1\" calcMode=\"spline\" keySplines=\"0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1\" dur=\"6s\" repeatCount=\"indefinite\"><\/animate><\/path><\/g><\/svg>\n<\/div>\n<p class=\"p\" style=\"text-align:center;margin-top:20px\">Cómo apostar por tus valores<br><\/p>", "01": "<div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px\">\n<svg viewBox=\"0 0 310 310\" width=\"310\" height=\"310\" role=\"img\" aria-label=\"Tubería incompleta: el agua se derrama por el extremo abierto\">\n<defs><pattern id=\"g2\" width=\"62\" height=\"62\" patternUnits=\"userSpaceOnUse\"><rect width=\"62\" height=\"62\" fill=\"none\" stroke=\"#1d3440\"><\/rect><\/pattern><\/defs>\n<rect width=\"310\" height=\"310\" fill=\"url(#g2)\"><\/rect>\n<rect class=\"gap\" x=\"249\" y=\"125\" width=\"60\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"#9fd0df\" stroke-dasharray=\"5 5\"><\/rect>\n<g fill=\"none\"><path d=\"M0 31H131Q155 31 155 55V131Q155 155 179 155H248\" stroke=\"#5f93a3\" stroke-width=\"22\"><\/path><path d=\"M0 31H131Q155 31 155 55V131Q155 155 179 155H248\" stroke=\"#0f1f27\" stroke-width=\"18\"><\/path><path d=\"M0 31H131Q155 31 155 55V131Q155 155 179 155H248\" pathLength=\"100\" class=\"wf\" stroke=\"#4c9bb3\" stroke-width=\"8\"><\/path><\/g>\n<path class=\"sp\" d=\"M248 147c20-8 34 6 30 26-3 18-14 28-26 30-6-10-10-34-4-56z\" fill=\"#4c9bb3\"><\/path>\n<circle class=\"dr\" cx=\"288\" cy=\"205\" r=\"4\" fill=\"#4c9bb3\"><\/circle><circle class=\"dr\" style=\"animation-delay:.4s\" cx=\"270\" cy=\"232\" r=\"3\" fill=\"#4c9bb3\"><\/circle>\n<\/svg>\n<p class=\"p\" style=\"max-width: 290px; font-family: Open Sans, sans-serif; font-size: 16px\"><span style=\"color: rgb(148, 163, 184); font-family: &quot;Plus Jakarta Sans&quot;, sans-serif; font-size: medium; background-color: rgb(11, 19, 25)\">Cuando tu información no encuentra un cauce continuo, el sistema se satura y desborda.<\/span><br><br>Avanza con la flecha para agregar la pieza.<\/p>\n<\/div>\n", "02": "<div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px\">\n<svg viewBox=\"0 0 310 310\" width=\"310\" height=\"310\" role=\"img\" aria-label=\"Tubería completa: el agua fluye hasta la salida\">\n<defs><pattern id=\"g3\" width=\"62\" height=\"62\" patternUnits=\"userSpaceOnUse\"><rect width=\"62\" height=\"62\" fill=\"none\" stroke=\"#1d3440\"><\/rect><\/pattern><\/defs>\n<rect width=\"310\" height=\"310\" fill=\"url(#g3)\"><\/rect>\n<g fill=\"none\"><path d=\"M0 31H131Q155 31 155 55V131Q155 155 179 155H255Q279 155 279 179V310\" stroke=\"#5f93a3\" stroke-width=\"22\"><\/path><path d=\"M0 31H131Q155 31 155 55V131Q155 155 179 155H255Q279 155 279 179V310\" stroke=\"#0f1f27\" stroke-width=\"18\"><\/path><path d=\"M0 31H131Q155 31 155 55V131Q155 155 179 155H255Q279 155 279 179V310\" pathLength=\"100\" class=\"wf\" stroke=\"#4c9bb3\" stroke-width=\"8\"><\/path><\/g>\n<\/svg>\n<p class=\"p\" style=\"max-width: 290px; font-family: Open Sans, sans-serif\">Ahora sí…<br>Tu flujo continúa.<\/p>\n<\/div>\n", "03": "<h1 class=\"t\" style=\"font-size:26px;line-height:32px;margin:0\">Para mejorar tu flujo, vamos a:<\/h1>\n<div><details class=\"inf pi\"><summary><span class=\"num\">1<\/span><span class=\"tt\">Construir tu mapa personal<\/span><\/summary><\/details><details class=\"inf pi\"><summary><span class=\"num\">2<\/span><span class=\"tt\">Apostar por ti con una actividad<\/span><\/summary><\/details><details class=\"inf pi\"><summary><span class=\"num\">3<\/span><span class=\"tt\">Acompañar tu evolución<\/span><\/summary><\/details><\/div>\n<details class=\"inf\"><summary><span class=\"ii\">i<\/span>¿Por dónde es mejor apostar?<\/summary><div class=\"ip\"><p>Tenemos incontables flujos en redes, que formarían nuestros valores y cada persona forma un mapa único. Puede no ser fácil.<\/p><p style=\"margin-top:8px\"><b>¿Cómo saber por dónde es mejor apostar?<\/b><\/p><p style=\"margin-top:8px\">No podemos ofrecer una respuesta.<\/p><p style=\"margin-top:8px\">Pero sí podemos ofrecer una metodología personal para ayudarte a filtrar tus respuestas en una tormenta de información.<\/p><p style=\"margin-top:8px\">Un mapa de tu información.<\/p><p style=\"margin-top:8px\">Así podrás construir tus flujos y evaluarte según tu realidad, haciendo las mejores apuestas posibles por tus valores.<\/p><p style=\"margin-top:8px\">Cada registro es una apuesta pequeña: apuestas, actúas, comparas y actualizas lo que crees de ti.<\/p><p style=\"margin-top:8px\">*El mapa no es el territorio, es una simplificación para navegar, y nuestros procesos no conscientes pueden ser un mar enorme.<\/p><\/div><\/details>\n", "04": "<div><details class=\"inf pi\"><summary><h1 style=\"color: rgb(207, 227, 232); font: 500 30px / 1.15 &quot;Cormorant Garamond&quot;, serif; margin: 0px\">Flujo, concepto<\/h1><span class=\"tt\"><br><\/span><span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:10px 0\"><p>En la primera parte, mapearemos tus necesidades y potenciales de flujo, para saber dónde están tus cuellos de botella y dónde apalancarte.<\/p><p class=\"tg\">#cibernética<\/p><\/div><\/details><\/div><p class=\"p\" style=\"margin-bottom: 20px; width: 342px; height: 8px\"><br><\/p><svg viewBox=\"0 0 342 300\" width=\"342\" height=\"300\" role=\"img\" aria-label=\"Río con entrada a la izquierda, proceso en el centro y salida a la derecha. Un molino de agua sobre el proceso gira cuando el agua pasa. Una línea de retroalimentación lleva la salida de vuelta a la entrada\"><g transform=\"translate(171 65) scale(.5) translate(-171 -222)\"><g class=\"wh\" stroke=\"#dbe8ec\" stroke-width=\"2\" stroke-linecap=\"round\" fill=\"none\"><animateTransform attributeName=\"transform\" type=\"rotate\" values=\"0 171 222;0 171 222;-110 171 222;-2475 171 222;-2565 171 222\" keyTimes=\"0;0.2;0.26;0.95;1\" calcMode=\"spline\" keySplines=\"0 0 1 1;0.42 0 1 1;0 0 1 1; =\"100\" fill=\"none\" stroke=\"#4f9bb5\" stroke-width=\"2.4\" stroke-linecap=\"round\"><animate attributeName=\"stroke-dashoffset\" values=\"100;100;0;0;100;100\" keyTimes=\"0;0.68;0.71;0.8;0.83;1\" dur=\"8s\" repeatCount=\"indefinite\"><\/animate><\/path><path d=\"M86 124L92 112L98 124z\" fill=\"#b9cdd4\"><\/path><path d=\"M171 229V274\" fill=\"none\" stroke=\"#b9cdd4\" stroke-width=\"1\"><\/path><circle cx=\"171\" cy=\"222\" r=\"5\" fill=\"#dbe8ec\"><\/circle><g fill=\"#dbe8ec\" font-family=\"Open Sans,sans-serif\" font-size=\"13\" font-weight=\"500\" text-anchor=\"middle\"><text x=\"40\" y=\"20\">Entrada<\/text><text x=\"171\" y=\"20\">Proceso<\/text><text x=\"302\" y=\"20\">Salida<\/text><text x=\"171\" y=\"292\">Retroalimentación<\/text><\/g><\/svg><p class=\"p\" style=\"margin-bottom:20px\"><span style=\"color: rgb(219, 232, 236); font-size: 12px\"><br><br>Todo sistema de información puede ser dividido en: <br>Entrada, proceso, salida y&nbsp;<\/span><span style=\"color: rgb(219, 232, 236); font-size: 12px\">retroalimentación <\/span><span style=\"color: rgb(219, 232, 236); font-size: 12px\">.&nbsp;<\/span><\/p>\n\n", "05": "<div><details class=\"inf pi\"><summary><h1 style=\"color: rgb(207, 227, 232); font: 500 30px / 1.15 &quot;Cormorant Garamond&quot;, serif; margin: 0px\">Entrada y salida<\/h1><span class=\"tt\"><br><\/span><span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:10px 0\"><p>Empieza con una palabra clave que será usada por ti y define:<\/p><p style=\"margin-top:8px\"><b>Entrada:<\/b><br>qué buscás del mundo para ti, hacia adentro;<\/p><p style=\"margin-top:8px\"><b>Salida:<\/b><br>qué oferta de ti para el mundo, hacia afuera.<\/p><p style=\"margin-top:8px\">Y si no te resulta tan fácil, en el icono de abajo hay un experimento mental que te puede facilitar.<\/p><p class=\"tg\">#cibernética<\/p><\/div><\/details><\/div>\n\n<div style=\"display:flex;margin-top:28px\">\n<div style=\"flex:1;text-align:center;padding:0 10px;border-right:1px solid #2b4a58\">\n\n<div class=\"p\" style=\"font-size:13px;margin-top:6px\">Entrada<\/div>\n<textarea data-bind=\"flow.in\" aria-label=\"Valores que quieres conquistar\" placeholder=\"Escribe tu valor a conquistar:\" style=\"display:block;box-sizing:border-box;width:100%;height:96px;margin-top:12px;padding:10px 12px;border:1px solid #5f93a3;border-radius:12px;background:transparent;color:#dbe8ec;font-family:'Open Sans',sans-serif;font-size:13px;line-height:19px;resize:none;text-align:left\"><\/textarea>\n<\/div>\n<div style=\"flex:1;text-align:center;padding:0 10px\">\n\n<div class=\"p\" style=\"font-size:13px;margin-top:6px\">Salida<\/div>\n<textarea data-bind=\"flow.out\" aria-label=\"Valores que quieres ofertar\" placeholder=\"Escribe qué valor quieres ofertar:\" style=\"display:block;box-sizing:border-box;width:100%;height:96px;margin-top:12px;padding:10px 12px;border:1px solid #5f93a3;border-radius:12px;background:transparent;color:#dbe8ec;font-family:'Open Sans',sans-serif;font-size:13px;line-height:19px;resize:none;text-align:left\"><\/textarea>\n<\/div>\n<\/div><svg viewBox=\"0 0 342 150\" width=\"342\" height=\"150\" role=\"img\" aria-label=\"Río que va de la entrada, a la izquierda, a la salida, a la derecha. Cada punto está unido por una línea a su caja de texto de arriba. Una línea de retroalimentación lleva la salida de vuelta a la entrada\"><defs><path id=\"rv\" d=\"M0 70H342\"><\/path><\/defs><g fill=\"none\"><use href=\"#rv\" stroke=\"#5f93a3\" stroke-width=\"22\"><\/use><use href=\"#rv\" stroke=\"#0f1f27\" stroke-width=\"18\"><\/use><use href=\"#rv\" stroke=\"#4c9bb3\" stroke-width=\"8\"><\/use><\/g><g stroke=\"#b9cdd4\" stroke-width=\"1.5\"><path d=\"M40 0V64\"><\/path><path d=\"M302 0V64\"><\/path><\/g><g fill=\"#dbe8ec\"><circle cx=\"40\" cy=\"70\" r=\"5\"><\/circle><circle cx=\"171\" cy=\"70\" r=\"5\"><\/circle><circle cx=\"302\" cy=\"70\" r=\"5\"><\/circle><\/g><path d=\"M302 92V130H44V100\" fill=\"none\" stroke=\"#b9cdd4\" stroke-width=\"1.5\"><\/path><path d=\"M38 102L44 90L50 102z\" fill=\"#b9cdd4\"><\/path><\/svg><p class=\"p\" style=\"margin-bottom:20px\"><br><\/p><details style=\"margin-bottom:16px\"><div style=\"box-sizing: border-box; padding: 14px 16px; border: 1px solid #2b4a58; border-radius: 14px; background: #14303b; font-size: 12px; line-height: 23px; font-family: Open Sans, sans-serif\">Experimento mental: imagina que vas a perder totalmente la memoria y tienes un minuto para escribir dos valores para orientar tu \"yo del futuro\". <br>¿En qué valores debería enfocarse tu \"yo del futuro\"?<\/div><summary aria-label=\"Ver experimento mental\" style=\"display:flex;align-items:center;min-height:44px;cursor:pointer;list-style:none\"><span style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;box-sizing:border-box;border:1px solid #dbe8ec;border-radius:50%;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;color:#dbe8ec\">!<\/span><span style=\"margin-left:10px;font-family:'Open Sans',sans-serif;font-size:13px;color:#dbe8ec\">Experimento mental<\/span><\/summary><\/details>", "06": "<div><details class=\"inf pi\"><summary><h1 style=\"color: rgb(207, 227, 232); font: 500 30px / 1.15 &quot;Cormorant Garamond&quot;, serif; margin: 0px\">Áreas, concepto<\/h1><span class=\"tt\"><br><\/span><span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:10px 0\"><p>Mapearemos tus necesidades y potenciales en las áreas en las que puedes actuar.<\/p><p style=\"margin-top:8px\">Cada área gastaría más energía, pero tendría más potencial de cambios personales y en el mundo.<\/p><p style=\"margin-top:8px;font-style:italic;color:#9db6c0\">Hipótesis de trabajo, no dato: tus registros la pondrán a prueba.<\/p><p style=\"margin-top:8px\">Simplificamos las cuatro áreas de los procesos de la mente (Mente Barco):<\/p><p style=\"margin-top:8px\">reactivo → Corporal<br>predictivo → Racional<br>ponderado → Emocional<br>integrador → Social<\/p><p style=\"margin-top:8px\">Cada una incluye a la anterior.<\/p><p class=\"tg\">#sistemas de información<\/p><\/div><\/details><\/div>\n\n<svg viewBox=\"0 0 342 300\" width=\"342\" height=\"300\" role=\"img\" aria-label=\"Red de cauces que se simplifica: ocho cauces sociales, cuatro emocionales, dos racionales y uno corporal. El agua entra por la derecha, llega al área corporal y sube hasta el social, encendiendo el color de cada área. Cuando el agua deja de subir, baja de arriba hacia abajo y sale por el canal de la izquierda del área corporal\"><defs><path id=\"nc\" d=\"M0 292H196Q220 292 220 268V250\"><\/path><path id=\"nc2\" d=\"M342 292H244Q220 292 220 268V250\"><\/path><path id=\"nr\" d=\"M160 180C160 215 220 215 220 250M280 180C280 215 220 215 220 250\"><\/path><path id=\"nm\" d=\"M130 110C130 145 160 145 160 180M190 110C190 145 160 145 160 180M250 110C250 145 280 145 280 180M310 110C310 145 280 145 280 180\"><\/path><path id=\"ns\" d=\"M115 40C115 75 130 75 130 110M145 40C145 75 130 75 130 110M175 40C175 75 190 75 190 110M205 40C205 75 190 75 190 110M235 40C235 75 250 75 250 110M265 40C265 75 250 75 250 110M295 40C295 75 310 75 310 110M325 40C325 75 310 75 310 110\"><\/path><\/defs><g fill=\"none\"><use href=\"#nc\" stroke=\"#2b4a58\" stroke-width=\"16\"><\/use><use href=\"#nc2\" stroke=\"#2b4a58\" stroke-width=\"16\"><\/use><use href=\"#nr\" stroke=\"#2b4a58\" stroke-width=\"16\"><\/use><use href=\"#nm\" stroke=\"#2b4a58\" stroke-width=\"16\"><\/use><use href=\"#ns\" stroke=\"#2b4a58\" stroke-width=\"16\"><\/use><\/g><g fill=\"none\" class=\"lit lt1\"><animate attributeName=\"opacity\" values=\"0;0;1;1;0\" keyTimes=\"0;0.06;0.1;0.96;1\" calcMode=\"spline\" keySplines=\"0 0 1 1;0.42 0 0.58 1;0 0 1 1;0.42 0 0.58 1\" dur=\"8s\" begin=\"0s\" repeatCount=\"indefinite\"><\/animate><use href=\"#nc\" stroke=\"#F49F96\" stroke-width=\"16\"><\/use><use href=\"#nc2\" stroke=\"#F49F96\" stroke-width=\"16\"><\/use><\/g><g fill=\"none\" class=\"lit lt2\"><animate att "opacity\" values=\"0;0;1;1;0;0\" keyTimes=\"0;0.51;0.55;0.63;0.71;1\" calcMode=\"spline\" keySplines=\"0 0 1 1;0.42 0 0.58 1;0 0 1 1;0.42 0 0.58 1;0 0 1 1\" dur=\"8s\" begin=\"0s\" repeatCount=\"indefinite\"><\/animate><circle cx=\"115\" cy=\"40\" r=\"6\"><\/circle><circle cx=\"145\" cy=\"40\" r=\"6\"><\/circle><circle cx=\"175\" cy=\"40\" r=\"6\"><\/circle><circle cx=\"205\" cy=\"40\" r=\"6\"><\/circle><circle cx=\"235\" cy=\"40\" r=\"6\"><\/circle><circle cx=\"265\" cy=\"40\" r=\"6\"><\/circle><circle cx=\"295\" cy=\"40\" r=\"6\"><\/circle><circle cx=\"325\" cy=\"40\" r=\"6\"><\/circle><circle cx=\"5\" cy=\"41\" r=\"4\"><\/circle><\/g><g fill=\"#dbe8ec\" font-family=\"Cormorant Garamond,serif\" font-size=\"17\" font-weight=\"500\"><text x=\"16\" y=\"46\">Social<\/text><text x=\"16\" y=\"116\">Emocional<\/text><text x=\"16\" y=\"186\">Racional<\/text><text x=\"16\" y=\"256\">Corporal<\/text><\/g><\/svg>", "07": "<details class=\"inf pi dimhead\"><summary><h1 class=\"t\" style=\"margin:6px 0 4px\"><span style=\"display:inline-block;width:12px;height:12px;border-radius:50%;background:#69AFA6;margin-right:10px\"><\/span>Social<\/h1><span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:6px 0 10px\"><div class=\"ik\">Proceso integrador<\/div><p>Todo lo que cuenta en tu vida: otros seres, tu motivación, lo que entiendes y tu cuerpo.<\/p><div class=\"ik\">Qué resta<\/div><p>No resta nada. Es el área que más depende de otros seres de todos tus procesos.<\/p><div class=\"ik\">Se enfoca más en<\/div><p>los demás.<\/p><div class=\"ik\">Certeza y potencial<\/div><p>Es el más incierto y el de más potencial de resultados.<\/p><div class=\"ik\">Ejemplos<\/div><ul><li>Quiero criar a mis hijos con calma.<\/li><li>Quiero aportar a mi comunidad.<\/li><li>Quiero tener amistades honestas.<\/li><\/ul><p style=\"margin-top:10px;color:#b9cdd4\">No es absoluto. Es relativo a ti y a tus otros valores.<\/p><\/div><\/details><div style=\"display:flex;justify-content:center\ ja la dependencia de otros seres.<\/p><div class=\"ik\">Se enfoca más en<\/div><p>ti.<\/p><div class=\"ik\">Certeza y potencial<\/div><p>Es algo menos incierto que el social y con menos potencial de resultados.<\/p><div class=\"ik\">Ejemplos<\/div><ul><li>Quiero crear algo propio.<\/li><li>Quiero sentirme en calma.<\/li><li>Quiero aprender lo que me apasiona.<\/li><\/ul><p style=\"margin-top:10px;color:#b9cdd4\">No es absoluto. Es relativo a ti y a tus otros valores.<\/p><\/div><\/details><div style=\"display:flex;justify-content:center\"><svg viewBox=\"100 98 240 94\" width=\"183\" height=\"72\" role=\"img\" aria-label=\"Área emocional: 4 cauces que bajan desde 4 bolitas azules hasta 2 bolitas moradas\"><g fill=\"none\"><path d=\"M130 110C130 145 160 145 160 180M190 110C190 145 160 145 160 180M250 110C250 145 280 145 280 180M310 110C310 145 280 145 280 180\" stroke=\"#2b4a58\" stroke-width=\"16\"><\/path><path d=\"M130 110C130 145 160 145 160 180M190 110C190 145 160 145 160 180M250 110C250 145 280 145 280 180M310 110C310 145 280 145 280 180\" stroke=\"#3A6FBF\" stroke-width=\"16\"><\/path><path d=\"M130 110C130 145 160 145 160 180M190 110C190 145 160 145 160 180M250 110C250 145 280 145 280 180M310 110C310 145 280 145 280 180\" stroke=\"#0f1f27\" stroke-width=\"12\"><\/path><path pathLength=\"100\" stroke-dasharray=\"100 100\" stroke-dashoffset=\"100\" d=\"M130 110C130 145 160 145 160 180M190 110C190 145 160 145 160 180M250 110C250 145 280 145 280 180M310 110C310 145 280 145 280 180\" stroke=\"#4c9bb3\" stroke-width=\"7\"><animate attributeName=\"stroke-dashoffset\" values=\"100;100;0;0;-100\" keyTimes=\"0;0.0;0.3;0.92;1\" calcMode=\"spline\" keySplines=\"0 0 1 1;0.42 0 0.58 1;0 0 1 1;0.42 0 0.58 1\" dur=\"9s\" repeatCount=\"indefinite\"><\/animate><\/path><\/g><g fill=\"#3A6FBF\"><circle cx=\"130\" cy=\"110\" r=\"6\"><\/circle><circle cx=\"190\" cy=\"110\" r=\"6\"><\/circle><circle cx=\"250\" cy=\"110\" r=\"6\"><\/circle><circle cx=\"310\" cy=\"110\" r=\"6\"><\/cir  que bajan desde 2 bolitas moradas hasta la bolita del área corporal\"><g fill=\"none\"><path d=\"M160 180C160 215 220 215 220 250M280 180C280 215 220 215 220 250\" stroke=\"#2b4a58\" stroke-width=\"16\"><\/path><path d=\"M160 180C160 215 220 215 220 250M280 180C280 215 220 215 220 250\" stroke=\"#865068\" stroke-width=\"16\"><\/path><path d=\"M160 180C160 215 220 215 220 250M280 180C280 215 220 215 220 250\" stroke=\"#0f1f27\" stroke-width=\"12\"><\/path><path pathLength=\"100\" stroke-dasharray=\"100 100\" stroke-dashoffset=\"100\" d=\"M160 180C160 215 220 215 220 250M280 180C280 215 220 215 220 250\" stroke=\"#4c9bb3\" stroke-width=\"7\"><animate attributeName=\"stroke-dashoffset\" values=\"100;100;0;0;-100\" keyTimes=\"0;0.0;0.3;0.92;1\" calcMode=\"spline\" keySplines=\"0 0 1 1;0.42 0 0.58 1;0 0 1 1;0.42 0 0.58 1\" dur=\"9s\" repeatCount=\"indefinite\"><\/animate><\/path><\/g><g fill=\"#865068\"><circle cx=\"160\" cy=\"180\" r=\"6\"><\/circle><circle cx=\"280\" cy=\"180\" r=\"6\"><\/circle><\/g><g fill=\"#F49F96\"><circle cx=\"220\" cy=\"250\" r=\"6\"><\/circle><\/g><\/svg><\/div>\n\n<div class=\"f\" style=\"border-color:#865068;margin-top:10px\"><textarea data-bind=\"dim.r\" placeholder=\"Escribe qué mejorar en tu área racional:\" style=\"display:block;box-sizing:border-box;width:100%;height:56px;margin-top:6px;border:none;background:transparent;color:#dbe8ec;font-family:'Open Sans',sans-serif;font-size:15px;line-height:22px;resize:none;outline:none\"><\/textarea><\/div>\n<details class=\"inf\"><summary><span class=\"ex\">!<\/span>Experimento mental<\/summary><div class=\"ip\"><p>imagina que vas a perder totalmente la memoria y tienes un minuto para escribir dos valores para orientar tu \"yo del futuro\".<br>¿En qué valores debería enfocarse tu \"yo del futuro\"?<\/p><\/div><\/details>\n\n", "10": "<details class=\"inf pi dimhead\"><summary><h1 class=\"t\" style=\"margin:6px 0 4px\"><span style=\"display:inline-block;width:12px;height:12px;border-radius:50%;bac al]<\/div><div class=\"tl\">Racional · Salida<\/div><div class=\"tv\">[Texto que escribiste en tu salida racional]<\/div><\/div><div class=\"tx d4\"><div class=\"tl\">Corporal · Entrada<\/div><div class=\"tv\">[Texto que escribiste en tu entrada corporal]<\/div><div class=\"tl\">Corporal · Salida<\/div><div class=\"tv\">[Texto que escribiste en tu salida corporal]<\/div><\/div><\/div><div class=\"bt\"><\/div><div class=\"cl d1\" style=\"--c: #69AFA6; width: 340px\"><span class=\"ct\">Social<\/span>[Tu entrada social]<\/div><div class=\"cl d2\" style=\"--c: #3A6FBF\"><span class=\"ct\">Emocional<\/span>[Tu salida emocional]<\/div><div class=\"cl d3\" style=\"--c: #865068\"><span class=\"ct\">Racional<\/span>[Tu salida racional]<\/div><div class=\"cl d4\" style=\"--c: #F49F96\"><span class=\"ct\">Corporal<\/span>[Tu salida corporal]<\/div><div class=\"mp\"><\/div>\n\n", "12": "<div><details class=\"inf pi\"><summary><h1 style=\"color: rgb(207, 227, 232); font: 500 30px / 1.15 &quot;Cormorant Garamond&quot;, serif; margin: 0px\">Actividad para apostar por ti<\/h1><span class=\"tt\"><br><\/span><span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:10px 0\"><div>Definí algo que puedas hacer, incluso si el día se complica.<br><div><p>Definí qué te gustaría conseguir, sin confundir el deseo con una garantía.<br>Obstáculo<br>«Si me frustro, reduciré la tarea a cinco minutos». O: «Si me falta una herramienta, buscaré una alternativa».<\/p><\/div><div><div><\/div><div><p><\/p><\/div><\/div><\/div><p class=\"tg\">#ciencia del comportamiento<\/p><\/div><\/details><\/div><div class=\"pl\"><svg viewBox=\"0 0 64 548\" width=\"64\" height=\"548\" role=\"img\" aria-label=\"Tubería vertical: al llenar las cuatro casillas, el agua sube hasta la actividad ideal\" style=\"display:block\">\n<defs><clipPath id=\"ch\"><rect x=\"16\" y=\"10\" width=\"16\" height=\"550\"><\/rect><\/clipPath><\/defs>\n<path d=\"M24 560V10\" stroke=\"#2b4a58\" stroke-width=\"26\" stroke-linecap=\"round\" fill=\"none\"><\/path>\n<path d=\"M24 560V10\" stroke=\"#0f1f27\" stroke-width=\"16\" stroke-linecap=\"round\" fill=\"none\"><\/path>\n<g clip-path=\"url(#ch)\"><rect class=\"wt\" x=\"16\" y=\"0\" width=\"16\" height=\"560\" fill=\"#4c9bb3\"><\/rect><rect class=\"pu\" x=\"16\" y=\"0\" width=\"16\" height=\"34\" rx=\"8\" fill=\"#9fd0df\"><\/rect><\/g>\n<path d=\"M29 73H64\" stroke=\"#5f93a3\" stroke-width=\"1.5\"><\/path><path d=\"M29 213H64\" stroke=\"#5f93a3\" stroke-width=\"1.5\"><\/path><path d=\"M29 353H64\" stroke=\"#5f93a3\" stroke-width=\"1.5\"><\/path><path d=\"M29 493H64\" stroke=\"#5f93a3\" stroke-width=\"1.5\"><\/path>\n<circle class=\"nd up\" cx=\"24\" cy=\"73\" r=\"5.5\"><\/circle><circle class=\"nd up\" cx=\"24\" cy=\"213\" r=\"5.5\"><\/circle><circle class=\"nd up\" cx=\"24\" cy=\"353\" r=\"5.5\"><\/circle><circle class=\"nd\" cx=\"24\" cy=\"493\" r=\"5.5\"><\/circle>\n<path class=\"gh\" d=\"M10 345L22 341L38 345L40 359L28 366L12 362Z\" fill=\"none\" stroke=\"#b9cdd4\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"><\/path>\n<path class=\"ob\" d=\"M10 345L22 341L38 345L40 359L28 366L12 362Z\" fill=\"#F49F96\"><\/path>\n<\/svg><div class=\"bs\"><div class=\"bk\"><label class=\"lb\" for=\"ideal\">Ideal<\/label><textarea id=\"ideal\" data-bind=\"activity.ideal\" aria-label=\"Actividad ideal\" placeholder=\"¿Cuál es el mejor resultado que quiero alcanzar?\"><\/textarea><\/div><div class=\"bk\"><label class=\"lb\" for=\"sign\">Significativa<\/label><textarea id=\"sign\" data-bind=\"activity.sign\" aria-label=\"Actividad significativa\" placeholder=\"¿Qué acción pequeña me permitirá avanzar o descubrir algo útil?\"><\/textarea><\/div><div class=\"bk\"><label class=\"lb lo\" for=\"obst\">Obstáculo<\/label><textarea id=\"obst\" data-bind=\"activity.obst\" aria-label=\"Obstáculo\" placeholder=\"¿Qué podría dificultar mi avance, dentro o fuera de mí?\"><\/textarea><\/div><div class=\"bk\"><label class=\"lb\" for=\"resp\">PLAN<\/label><textarea id=\"resp\" data-bind=\"activity.plan\" aria-label=\"Respuesta al obstáculo\" placeholder=\"Si aparece ese obstáculo, ¿qué haré?\"><\/textarea><\/div><\/div><\/div>", "13": "<div><details class=\"inf pi\"><summary><h1 style=\"color: rgb(207, 227, 232); font: 500 30px / 1.15 &quot;Cormorant Garamond&quot;, serif; margin: 0px\">Actividad, retroevaluación<\/h1><span class=\"tt\"><br><\/span><span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:10px 0\"><p style=\"margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid #2b4a58;font-weight:600;font-size:14px;line-height:1.4;color:#dbe8ec\">Llena cada recipiente según cómo te sentiste en tu última actividad, o evalúa tu última semana como base.<\/p><p>Nuestra base de evaluación es la motivación y la satisfacción. A veces estamos muy motivados sin estar muy satisfechos. Y a veces estamos muy satisfechos sin estar muy motivados.<\/p><p>Por ejemplo, quiero comprar el teléfono nuevo X. Estoy muy motivado, pero al comprarlo no me da tanta satisfacción como esperaba.<\/p><p>O a veces le doy a un vecino la respuesta ácida que quería darle. Tenía poca motivación para darla, pero me quedé muy satisfecho.<\/p><p>Por eso evaluaremos, como base, la motivación y la satisfacción.&nbsp;<\/p>\n<p>Evalúa apenas termines. Con los días, la memoria suaviza lo vivido.<\/p>\n<p class=\"tg\" style=\"color: #9fd0df\">#neurociencia afectiva<\/p><\/div><\/details><\/div><div data-card=\"retro\"><\/div>\n\n<div class=\"vrow\" data-vessels=\"retro\"><\/div>\n", "14": "<div><details class=\"inf pi\"><summary><h1 style=\"color: rgb(207, 227, 232); font: 500 30px / 1.15 &quot;Cormorant Garamond&quot;, serif; margin: 0px\">Actividad, apuesta<\/h1><span class=\"tt\"><br><\/span><span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:10px 0\"><p style=\"margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid #2b4a58;font-weight:600;font-size:14px;line-height:1.4;color:#dbe8ec\">Llena cada recipiente según cómo te sentirás al terminar la actividad.<\/p><p>Aquí no marcas lo que tienes hoy. Marcas tu apuesta: lo que prevés que cambiará en tu motivación y tu satisfacción si haces tu actividad.<\/p><p>Nuestra base de evaluación es la motivación y la satisfacción. A veces estamos muy motivados sin estar muy satisfechos. Y a veces estamos muy satisfechos sin estar muy motivados.<\/p><p>Por ejemplo, quiero comprar el teléfono nuevo X. Estoy muy motivado, pero al comprarlo no me da tanta satisfacción como esperaba.<\/p><p>O a veces le doy a un vecino la respuesta ácida que quería darle. Tenía poca motivación para darla, pero me quedé muy satisfecho.<\/p><p>Por eso evaluaremos, como base, la motivación y la satisfacción. Entonces, de todo nuestro mar de información, ¿por qué parte deberíamos apostar?<\/p>\n<p>Tu apuesta es un pronóstico. Esperar más de lo que ocurre es normal. No es un defecto.<\/p>\n<p class=\"tg\" style=\"color: #9fd0df\">#neurociencia afectiva<\/p><\/div><\/details><\/div><div data-card=\"pron\"><\/div>\n<div class=\"vrow\" data-vessels=\"pron\"><\/div>\n", "15": "<div style=\"margin: 12px 0 10px; font-size: 20px; color: #9fd0df; font-family: Open Sans, sans-serif\"><h1 class=\"t\" style=\"color: rgb(219, 232, 236); font-family: &quot;Cormorant Garamond&quot;, serif\">Elegí el flujo de enfoque de tu actividad<\/h1><\/div>\n\n\n\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n\n\n<\/div><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n\n<button class=\"o\" aria-pressed=\"false\" data-flow=\"c\"><span>Conquistar<\/span><small class=\"kw\" data-kw=\"flow.in\" hidden><\/small><\/button>\n<button class=\"o\" aria-pressed=\"false\" data-flow=\"o\"><span>Ofertar<\/span><small class=\"kw\" data-kw=\"flow.out\" hidden><\/small><\/button>\n\n<\/div><svg viewBox=\"0 0 342 150\" width=\"342\" height=\"150\" role=\"img\" aria-label=\"Río que va de la entrada, a la izquierda, a la salida, a la derecha. Cada punto está unido por una línea a su caja de   return base+'<g clip-path="url(#'+cid+')"><rect class="vf" x="21" width="108" fill="'+color+'" fill-opacity="0.2"/></g><path class="vl" fill="none" stroke="'+color+'" stroke-width="3" stroke-dasharray="7 6"/><circle class="vc" cx="75" r="11" fill="#0f1f27" stroke="'+color+'" stroke-width="2.5"/><path class="vm" stroke="'+color+'" stroke-width="2" stroke-linecap="round"/>';

function setVessel(svg,mode,p){
  var y=409-398*p/100;
  var f=$('.vf',svg); f.setAttribute('y',y); f.setAttribute('height',Math.max(0,420-y));
  if(mode==='fill'){ $('.vw',svg).setAttribute('d','M21 '+y+'q13.5-10 27 0t27 0t27 0t27 0'); }
  else{ $('.vl',svg).setAttribute('d','M21 '+y+'H129'); $('.vc',svg).setAttribute('cy',y); $('.vm',svg).setAttribute('d','M70 '+y+'H80'); }
  svg.setAttribute('aria-valuenow',p);
}
function buildVessels(host,which){
  var mode=which==='retro'?'fill':'forecast', obj, target=null;
  if(which==='retro'){target=retroTarget();var cur=target.rec&&target.rec.obt;obj={m:cur?cur.m:50,s:cur?cur.s:50};}
  else obj=S.activity.pron;
  [['m','Motivado','#4c9bb3'],['s','Satisfecho','#5DAE7A']].forEach(function(v){
    var col=document.createElement('div'); col.className='vcol';
    col.innerHTML='<svg class="vsvg" viewBox="0 0 150 420" role="slider" tabindex="0" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-label="'+v[1]+(mode==='fill'?' obtenido':' apostado')+'">'+vesselMarkup(v[0],v[2],mode)+'</svg><div class="vlab">'+v[1]+'</div><div class="vpct" aria-hidden="true"></div>';
    host.appendChild(col);
    var svg=$('svg',col), pct=$('.vpct',col);
    var upd=function(p,touch){
      obj[v[0]]=p;
      if(touch&&which==='pron') S.activity.touchedPron=true;
      if(touch&&which==='retro'){
        var rr=target.rec||baseRec(true); target.rec=rr; rr.obt={m:obj.m,s:obj.s}; rr.obtAt=new Date().toISOString();
        var c=$('[data-card]'); if(c) c.innerHTML=evalCard('retro');
      }
      setVessel(svg,mode,p); pct.textContent=p+'%'; save();
    };
    setVessel(svg,mode,obj[v[0]]); pct.textContent=obj[v[0]]+'%';
    var fromEvent=function(e){var r=svg.getBoundingClientRect(),yy=(e.clientY-r.top)*420/r.height;return clamp(Math.round((409-yy)/398*100),0,100);};
    var down=false;
    svg.addEventListener('pointerdown',function(e){down=true;try{svg.setPointerCapture(e.pointerId);}catch(x){}upd(fromEvent(e),true);e.preventDefault();});
    svg.addEventListener('pointermove',function(e){if(down)upd(fromEvent(e),true);});
    var up=function(){down=false;};
    svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
    svg.addEventListener('keydown',function(e){
      var d=({ArrowUp:5,ArrowRight:5,ArrowDown:-5,ArrowLeft:-5,PageUp:10,PageDown:-10})[e.key];
      if(e.key==='Home'){upd(0,true);e.preventDefault();return;} if(e.key==='End'){upd(100,true);e.preventDefault();return;}
      if(d){upd(clamp(obj[v[0]]+d,0,100),true);e.preventDefault();}
    });
  });
  /* botón + para agregar una nota */
  var btn=document.createElement('button'); btn.type='button'; btn.className='note-btn'; btn.setAttribute('aria-label','Agregar nota');
  btn.innerHTML='<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M9 3v12M3 9h12"/></svg>';
  var nr=document.createElement('div'); nr.className='noterow'; nr.appendChild(btn); host.insertAdjacentElement('afterend',nr);
  var box=document.createElement('div'); box.className='notebox';
  box.innerHTML='<label for="note-ta">Nota</label><textarea id="note-ta" placeholder="Escribe una nota…"></textarea>';
  nr.insertAdjacentElement('afterend',box);
  var ta=$('textarea',box); ta.value=noteGet(which); box.hidden=!ta.value;
  var sync=function(){btn.setAttribute('aria-expanded',String(!box.hidden));btn.classList.toggle('open',!box.hidden);};
  sync();
  btn.addEventListener('click',function(){box.hidden=!box.hidden;sync();if(!box.hidden)ta.focus();});
  ta.addEventListener('input',function(){noteSet(which,ta.value);});
}

  var t=e.target; if(!t||t.id!=='pf'||!t.files||!t.files[0]) return;
  var fr=new FileReader(); fr.onload=function(){importText(String(fr.result||''));}; fr.onerror=function(){evMsg('No se pudo leer el archivo.');}; fr.readAsText(t.files[0]); t.value='';
});

/* ---------- paginación ---------- */
var SECTIONS=[[[0,1,2,3],'Presentación'],[[4,5,6,7,8,9,10,11],'Mapeo'],[[13,12,14,15,16,17],'Actividad']];
function blocked(n){return false;}
function pager(id){
  var n=+id, sec=SECTIONS.filter(function(x){return x[0].indexOf(n)>=0;})[0];
  if(!sec) return '';
  var chev=function(d){return '<svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+d+'"/></svg>';};
  var dots=sec[0].map(function(k,i){
    return '<button class="pg-dot" data-go="'+k+'" aria-label="'+sec[1]+': pantalla '+(i+1)+' de '+sec[0].length+'"'+(k===n?' aria-current="step"':'')+'><span></span></button>';
  }).join('');
  return '<nav class="pager" aria-label="Navegación de '+sec[1]+'"><button class="pg-arrow" data-pager="prev" aria-label="Pantalla anterior"'+(n===0?' disabled':'')+'>'+chev('M13.5 5L7.5 11l6 6')+'</button><div class="pg-dots">'+dots+'</div><button class="pg-arrow" data-pager="next" aria-label="Pantalla siguiente">'+chev('M8.5 5l6 6-6 6')+'</button></nav>';
}
/* ---------- render ---------- */
function body(id){
  if(id==='11') return s11();
  if(id==='17') return s17();
  return T[id];
}
function render(){
  var id=pad(cur);
  if(id==='17') upsertRecord();
  var s=document.createElement('div'); s.className='s'+(dir?' in-'+dir:''); s.setAttribute('data-screen',id);
  s.innerHTML=id==='18'?s18():header(id)+body(id)+pager(id);
  app.replaceChildren(s);
  hook(s,id);
}
function syncReq(s){
  var pn=$('[data-pager="next"]',s); if(pn) pn.disabled=blocked(cur);
  $$('[data-req]',s).forEach(function(b){b.disabled=!(b.getAttribute('data-req')==='flow'?S.activity.flow:S.activity.dim);});
}
function quiz(s){
  var svg=$('svg.xv',s), qq=$('[data-qq]',s), qb=$('.qb',s), qr=$('[data-qr]',s); if(!svg||!qq) return;
  var L=[['s',4,'¿El resultado depende sobre todo de otros seres?','Integrador · Social'],
         ['e',3,'¿Depende sobre todo de cómo valoras o sientes?','Ponderado · Emocional'],
         ['r',2,'¿Depende sobre todo de información o de entender?','Predictivo · Racional'],
         ['c',1,'','Reactivo · Corporal']];
  var qi=0;
  function paint(done){
    L.forEach(function(l,i){
      var f=done>=0?done:qi; svg.setAttribute('data-st'+l[1], i<f?'dim':(i===f?'cur':'pend'));
    });
    if(done>=0){qq.textContent='Tu área: '+L[done][3]+'.';qb.hidden=true;}
    else{qq.textContent=L[qi][2];qb.hidden=false;}
    qr.hidden=!(done>=0||qi>0);
  }
  function idx(k){for(var i=0;i<L.length;i++) if(L[i][0]===k) return i; return -1;}
  function pick(i){var b=$('[data-dim="'+L[i][0]+'"]',s); b.click();}
  $$('[data-dim]',s).forEach(function(b){b.addEventListener('click',function(){paint(idx(b.getAttribute('data-dim')));});});
  $$('[data-qa]',s).forEach(function(b){b.addEventListener('click',function(){
    if(b.getAttribute('data-qa')==='y'){pick(qi);}
    else{qi++; if(qi>=3){qi=3;pick(3);}else paint(-1);}
  });});
  qr.addEventListener('click',function(){
    qi=0; S.activity.dim=''; save();
    $$('[data-dim]',s).forEach(function(x){x.setAttribute('aria-pressed','false');});
    syncReq(s); paint(-1);
  });
  var FL={1:$$('.fl0,.fl1',svg),2:$$('.fl2',svg),3:$$('.fl3',svg),4:$$('.fl4',svg)}, LT={1:$$('.lt1',svg),2:$$('.lt2',svg),3:$$('.lt3',svg),4:$$('.lt4',svg)};
  var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var rise=[0,0,0,0,0], tgt=4, tl=0, last=0, F=4;
  function focusLevel(){for(var n=1;n<=4;n++) if(svg.getAttribute('data-st'+n)==='cur') return n; return 4;}
  function frame(ts){
    if(!svg.isConnected) return;
    var dt=Math.min(.05,(ts-last)/1000||0); last=ts; F=focusLevel();
    for(var n=1;n<=tgt;n++){var prev=n===1?1:rise[n-1]; if(rise[n]<1&&prev>=1) rise[n]=RM?1:Math.min(1,rise[n]+dt/.9);}
    var risen=rise[tgt]>=1; if(risen) tl+=dt;
    for(var m=1;m<=4;m++){
      var pn=m<=tgt?rise[m]:0;
      if(m===F&&risen&&!RM) pn=.12+.88*(.5+.5*Math.cos(tl*2*Math.PI/3));
      var off=((1-pn)*100).toFixed(1), base=m===F?1:(m<F?.25:0), op=(base*Math.min(1,rise[m]*2)).toFixed(3);
      FL[m].forEach(function(e){e.style.strokeDashoffset=off;});
      LT[m].forEach(function(e){e.style.opacity=op;});
    }
    requestAnimationFrame(frame);
  }
  qr.addEventListener('click',function(){rise=[0,0,0,0,0];tgt=4;tl=0;});
  var d=idx(S.activity.dim); paint(d); tgt=focusLevel();
  requestAnimationFrame(frame);
}
function hook(s,id){
  $$('[data-bind]',s).forEach(function(el){
    el.value=getp(el.getAttribute('data-bind'))||'';
    el.addEventListener('input',function(){setp(el.getAttribute('data-bind'),el.value);save();});
  });
  $$('[data-card]',s).forEach(function(c){c.innerHTML=evalCard(c.getAttribute('data-card'));});
  $$('[data-vessels]',s).forEach(function(h){buildVessels(h,h.getAttribute('data-vessels'));});
  $$('[data-kw]',s).forEach(function(el){
    var v=String(getp(el.getAttribute('data-kw'))||'').replace(/\s+/g,' ').trim();
    if(v.length>60) v=v.slice(0,57)+'…';
    el.textContent=v; el.hidden=!v;
  });
  $$('[data-flow]',s).forEach(function(b){
    var k=b.getAttribute('data-flow'); b.setAttribute('aria-pressed',S.activity.flow===k);
    b.addEventListener('click',function(){S.activity.flow=k;save();$$('[data-flow]',s).forEach(function(x){x.setAttribute('aria-pressed',x===b);});syncReq(s);});
  });
  $$('[data-dim]',s).forEach(function(b){
    var k=b.getAttribute('data-dim'); b.setAttribute('aria-pressed',S.activity.dim===k);
    b.addEventListener('click',function(){S.activity.dim=k;save();$$('[data-dim]',s).forEach(function(x){x.setAttribute('aria-pressed',x===b);});syncReq(s);});
  });
  syncReq(s);
  if(id==='16') quiz(s);
  if(id==='03'){
    $$('.pi>summary',s).forEach(function(sm,i){sm.addEventListener('click',function(e){e.preventDefault();go([4,12,18][i]);});});
  }
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){
    $$('svg',s).forEach(function(v){try{v.pauseAnimations();v.setCurrentTime(5);}catch(e){}});
  }
  s.scrollTop=0;
}
app.addEventListener('click',function(e){
  var t=e.target, el;
  if((el=t.closest('[data-go]'))){e.preventDefault();go(+el.getAttribute('data-go'));return;}
  if((el=t.closest('[data-next]'))){if(!el.disabled)go(next());return;}
  if((el=t.closest('[data-pager]'))){if(!el.disabled)step(el.getAttribute('data-pager')==='next'?1:-1,18);return;}
  if(t.closest('[data-evo]')){go(18);return;}
  if(t.closest('[data-reset]')){S.activity=blankAct();save();go(13);return;}
  if((el=t.closest('[data-edit-act]'))){editAct(el.getAttribute('data-edit-act'),el.closest('[data-form]'));return;}
  if(!t.closest('[data-form]')&&(el=t.closest('[data-edit]'))){EV.edit=el.getAttribute('data-edit');render();return;}
  if((el=t.closest('[data-tab]'))){EV.tab=el.getAttribute('data-tab');EV.msg='';EV.confirm=false;render();return;}
  if((el=t.closest('[data-open]'))){var k=el.getAttribute('data-open');EV.open=EV.open===k?null:k;render();return;}
  if((el=t.closest('[data-chip]'))){chip(el.getAttribute('data-chip'));return;}
  if((el=t.closest('[data-data]'))){dataAction(el.getAttribute('data-data'));return;}
});
app.addEventListener('input',function(e){var t=e.target;if(t.type==='range'&&t.closest('[data-form]')){var o=t.closest('[data-form]').querySelector('[data-o="'+t.getAttribute('data-f')+'"]');if(o)o.textContent=t.value+'%';}});
app.addEventListener('keydown',function(e){var el=e.target.closest&&e.target.closest('[data-edit]');if(el&&e.target===el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();EV.edit=el.getAttribute('data-edit');render();}});
app.addEventListener('focusin',function(e){
  var t=e.target; if(t.tagName==='TEXTAREA'||t.tagName==='INPUT') setTimeout(function(){try{t.scrollIntoView({block:'center',behavior:'smooth'});}catch(x){}},320);
});
/* modo presentación en escritorio: escala el contenido para llenar la altura */
function fit(){
  var gp=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'))||0, d=innerWidth>=900&&innerHeight>=560, z=d?Math.max(1,Math.min(1.7,(innerHeight-gp)/760)):1;
  app.style.setProperty('--z',z.toFixed(3));
}
fit(); window.addEventListener('resize',fit);
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}

document.addEventListener('click',function(e){
  if(!e.target.closest('.ix')) $$('details.ix[open]').forEach(function(d){d.open=false;});

/* deslizar a los lados y flechas del teclado */
(function(){
  var x0=0,y0=0,ok=false;
  var skip=function(t){return t.closest&&t.closest('.vsvg,textarea,input,.mn,.pager,svg[role=slider]');};
  app.addEventListener('touchstart',function(e){var t=e.touches[0];x0=t.clientX;y0=t.clientY;ok=e.touches.length===1&&!skip(e.target);},{passive:true});
  app.addEventListener('touchend',function(e){
    if(!ok||cur===18) return; ok=false;
    var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>60&&Math.abs(dx)>1.6*Math.abs(dy)){ if(dx<0) step(1,17); else if(dx>0) step(-1,17); }
  },{passive:true});
  document.addEventListener('keydown',function(e){
    if(cur===18||e.altKey||e.ctrlKey||e.metaKey) return;
    var t=e.target; if(t&&(/^(TEXTAREA|INPUT|SELECT)$/.test(t.tagName)||t.getAttribute&&t.getAttribute('role')==='slider')) return;
    if(e.key==='ArrowRight'){step(1,17);} else if(e.key==='ArrowLeft'){step(-1,17);}
  });
})();
(function(){var mapped=!!(S.flow.in||S.flow.out||S.records.length||DIMS.some(function(d){return S.dim[d[0]];})); if(mapped) cur=13;})();
render();
})();
